line-flex;align-items:center}\n@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}\n@media (max-width:520px){.brand{font-size:1rem}.brand i{width:34px;height:34px}}\n.box a{color:var(--accent-text);font-weight:600;text-decoration:none}\n.box .big a:hover{text-decoration:underline}\n.box .sub{font-size:.9rem;color:var(--muted);margin-top:4px;font-weight:400}\n.themebtn{padding:8px 11px;display:grid;place-items:center}.themebtn svg{width:18px;height:18px;display:block}\n.themebtn .sun{display:none}html.dk .themebtn .sun{display:block}html.dk .themebtn .moon{display:none}\n.adm{font-size:.8rem;padding:6px 10px;min-height:36px;color:var(--muted)}\n.thumb.hasimg{padding:0;height:170px}\n.thumb img{width:100%;height:100%;object-fit:cover;display:block}\n.sheet.wide{max-width:680px}\n.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}\n.form .full{grid-column:1/-1}\n.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;color:var(--fg);font:inherit}\n.form textarea{min-height:64px;resize:vertical}\n@media (max-width:520px){.form{grid-template-columns:1fr}}\n.prev{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}\n.arow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}\n.arow img,.arow .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--tint)}\n.arow>div{min-width:0}\n.msgline{font-size:.85rem;margin:8px 0;min-height:1.2em;color:var(--muted)}\n.msgline.err{color:var(--danger)}\n.btn.danger{color:var(--danger);border-color:var(--danger)}\n.sheet h3{font-size:1rem;margin-block:18px 6px}\n\u003c/style>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap\">\n
